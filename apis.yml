name: TrustIQ
description: TrustIQ (operating as Trusting Social) is a Singapore-headquartered AI fintech
  that provides alternative-data credit scoring, fraud detection, and digital identity
  verification for lenders and consumer platforms across emerging Asian markets including
  India, Indonesia, Vietnam, and the Philippines. Its products — Trust Scores (AI credit
  and fraud scoring built from telco and alternative data), Trust Vision (facial-recognition
  digital onboarding and KYC), and Smart Customer Acquisition — help financial institutions
  extend credit to underbanked, new-to-credit consumers. Engagement is sales-led; the
  company publishes no public self-service API, SDK, or developer portal.
